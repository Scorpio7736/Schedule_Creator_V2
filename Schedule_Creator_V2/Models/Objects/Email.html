
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="x-apple-disable-message-reformatting">

    <!-- =========================================================
         DYNAMIC EMAIL COLOR SCHEME
         ========================================================= -->

    <meta name="color-scheme"
          content="{{COLOR_SCHEME}}">

    <meta name="supported-color-schemes"
          content="{{COLOR_SCHEME}}">

    <!-- =========================================================
         EMAIL TITLE
         ========================================================= -->

    <title id="emailTitle">
        UWGB Climbing Tower Email
    </title>

    <!-- =========================================================
         DYNAMIC EMAIL STYLES

         Replaced by EmailThemeService.

         Default:
             DefaultEmailStyles.css

         Let's Glow:
             LetsGlowStyles.css

         Tower of Power:
             TowerOfPowerStyles.css
         ========================================================= -->

    <style id="emailStyles">
        {{EMAIL_STYLES}}
    </style>

</head>

<body class="email-outer"
      style="
        margin:0 !important;
        padding:0 !important;
        width:100% !important;">

    <!-- =========================================================
         EMAIL PREHEADER
         ========================================================= -->

    <div id="preheaderText"
         style="
            display:none !important;
            visibility:hidden !important;
            max-height:0 !important;
            max-width:0 !important;
            overflow:hidden !important;
            opacity:0 !important;
            color:transparent !important;
            font-size:1px !important;
            line-height:1px !important;">

        A message from the UWGB Climbing Tower.

    </div>

    <!-- =========================================================
         OUTER EMAIL WRAPPER
         ========================================================= -->

    <table role="presentation"
           class="email-outer"
           width="100%"
           cellpadding="0"
           cellspacing="0"
           border="0"
           style="
                width:100%;
                border-collapse:collapse;">

        <tr>

            <td align="center"
                class="email-outer"
                style="
                    padding:24px 10px;">

                <!-- =================================================
                     MASTER EMAIL CONTAINER
                     ================================================= -->

                <table role="presentation"
                       class="email-container background-white"
                       width="100%"
                       cellpadding="0"
                       cellspacing="0"
                       border="0"
                       align="center"
                       style="
                            width:100%;
                            max-width:640px;
                            margin:0 auto;
                            text-align:left;
                            border-collapse:collapse;">

                    <!-- =================================================
                         HEADER
                         ================================================= -->
                    <!-- HEADER -->
                    <!-- =================================================
                         BODY
                         ================================================= -->
                    <!-- BODY -->
                    <!-- =================================================
                         IMAGE
                         ================================================= -->
                    <!-- IMAGE -->
                    <!-- =================================================
                         ANNOUNCEMENTS
                         ================================================= -->
                    <!-- ANNOUNCEMENTS -->
                    <!-- =================================================
                         REQUEST
                         ================================================= -->
                    <!-- REQUEST -->
                    <!-- =================================================
                         ATTACHMENTS
                         ================================================= -->
                    <!-- ATTACHMENTS -->
                    <!-- =================================================
                         SIGNATURE
                         ================================================= -->
                    <!-- SIGNATURE -->
                    <!-- =================================================
                         FOOTER
                         ================================================= -->
                    <!-- FOOTER -->

                </table>

            </td>

        </tr>

    </table>

</body>

</html>
